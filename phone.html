<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBOI.TOP — Обои для телефона</title>
<style>
  :root { --bg-1:#0a0a0f; --bg-2:#14121f; --bg-3:#1a1a2e; --accent:#66c0f4; --accent-2:#a64bff; --card:#16202d; --card-hover:#1e2f42; --text:#c7d5e0; --text-dim:#8f98a0; --green:#6fbf4a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',Arial,sans-serif; background:linear-gradient(135deg,var(--bg-1),var(--bg-2),var(--bg-3)); background-attachment:fixed; color:var(--text); min-height:100vh; }
  header { position:sticky; top:0; z-index:100; background:rgba(10,10,15,.88); backdrop-filter:blur(14px); border-bottom:1px solid rgba(102,192,244,.15); padding:12px 24px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .banner { height:50px; width:auto; border-radius:8px; display:block; transition:transform .3s; }
  .banner:hover { transform:scale(1.04); }
  .nav-tabs { display:flex; gap:6px; }
  .nav-tab { padding:9px 18px; border-radius:8px; background:transparent; border:1px solid transparent; color:var(--text-dim); font-size:14px; font-weight:600; cursor:pointer; text-decoration:none; transition:.25s; }
  .nav-tab:hover { color:var(--text); background:rgba(102,192,244,.08); }
  .nav-tab.active { color:#fff; background:linear-gradient(90deg,rgba(102,192,244,.25),rgba(166,75,255,.25)); border-color:rgba(102,192,244,.4); }
  .search-box { flex:1; max-width:320px; position:relative; min-width:180px; }
  .search-box input { width:100%; padding:10px 16px 10px 40px; border-radius:24px; border:1px solid rgba(102,192,244,.25); background:rgba(22,32,45,.9); color:var(--text); font-size:14px; outline:none; }
  .search-box input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(102,192,244,.18); }
  .search-box::before { content:'🔍'; position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:.7; font-size:13px; }
  .container { max-width:1400px; margin:0 auto; padding:30px 24px 60px; }
  .page-title { text-align:center; padding:20px 0 10px; }
  .page-title h1 { font-size:clamp(26px,4vw,42px); font-weight:900; margin-bottom:10px; background:linear-gradient(90deg,#fff,var(--accent),var(--accent-2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .page-title p { color:var(--text-dim); font-size:15px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; margin-top:24px; }
  .card { background:var(--card); border-radius:12px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,.5); transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,background .35s; cursor:pointer; display:flex; flex-direction:column; animation:fadeUp .5s ease both; }
  .card:hover { transform:translateY(-8px) scale(1.02); box-shadow:0 16px 40px rgba(102,192,244,.25),0 0 0 1px rgba(102,192,244,.4); background:var(--card-hover); }
  @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
  .thumb { position:relative; width:100%; aspect-ratio:9 / 16; overflow:hidden; background:#0d131c; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .6s cubic-bezier(.2,.8,.2,1),filter .35s; }
  .card:hover .thumb img { transform:scale(1.08); filter:brightness(.75); }
  .overlay { position:absolute; inset:0; background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.85)); opacity:0; transition:opacity .35s; display:flex; align-items:flex-end; padding:14px; }
  .card:hover .overlay { opacity:1; }
  .card-info { padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card-title { font-size:14px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  .card-badge { font-size:10px; color:var(--accent); background:rgba(102,192,244,.12); padding:3px 8px; border-radius:4px; font-weight:600; }
  .download-btn { display:inline-flex; align-items:center; gap:8px; background:linear-gradient(90deg,#4c9c3c,var(--green)); color:#fff; border:none; padding:10px 16px; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer; text-decoration:none; transition:.25s; box-shadow:0 4px 12px rgba(0,0,0,.4); white-space:nowrap; }
  .download-btn:hover { filter:brightness(1.15); transform:translateY(-2px); box-shadow:0 8px 20px rgba(111,191,74,.5); }
  .overlay .download-btn { width:100%; justify-content:center; }
  .empty { text-align:center; padding:80px 20px; color:var(--text-dim); font-size:18px; display:none; }
  .empty.show { display:block; }
  footer { text-align:center; padding:30px 20px; color:var(--text-dim); font-size:13px; border-top:1px solid rgba(102,192,244,.1); }
  footer b { color:var(--accent); }
  @media (max-width:640px) {
    header { padding:10px 14px; gap:10px; }
    .banner { height:38px; }
    .nav-tabs { order:3; width:100%; justify-content:center; }
    .search-box { order:4; max-width:100%; flex-basis:100%; }
    .grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
    .container { padding:16px 14px 40px; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html"><img src="banner.png" alt="Ash" class="banner"></a>
  <nav class="nav-tabs">
    <a href="index.html" class="nav-tab">Компьютер</a>
    <a href="phone.html" class="nav-tab active">📱 Телефон</a>
  </nav>
  <div class="search-box"><input type="text" id="search" placeholder="Поиск обоев..." autocomplete="off"></div>
</header>

<main class="container">
  <div class="page-title">
    <h1>📱 Обои для телефона</h1>
    <p>52 вертикальных обоины для смартфона. Скачивание в один клик.</p>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">😔 Ничего не найдено</div>
</main>

<footer>© <span id="year"></span> OBOI.TOP — Created by <b>Ash</b> & DeepSeek</footer>

<script>
/* ================= НАСТРОЙКИ =================
   Файлы называются: 1 (1).jpg, 1 (2).jpg ... 1 (52).jpg
   Количество: 52
*/
const PHONE_COUNT = 52;

/* ================= ЛОГИКА ================= */
const wallpapers = [];
for (let i = 1; i <= PHONE_COUNT; i++) {
  const fileName = "1 (" + i + ").jpg";
  wallpapers.push({
    title: "Обои " + i,
    img: "wallpaper/" + encodeURIComponent("Телефон") + "/" + encodeURIComponent(fileName),
    download: "wallpaper/" + encodeURIComponent("Телефон") + "/" + encodeURIComponent(fileName)
  });
}

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const searchInput = document.getElementById('search');

function render(list) {
  grid.innerHTML = '';
  if (!list.length) { empty.classList.add('show'); return; }
  empty.classList.remove('show');
  list.forEach((w, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (i * 0.02) + 's';
    card.innerHTML = `
      <div class="thumb">
        <img src="${w.img}" alt="${w.title}" loading="lazy">
        <div class="overlay">
          <a class="download-btn" href="${w.download}" download onclick="event.stopPropagation()">⬇️ Скачать</a>
        </div>
      </div>
      <div class="card-info">
        <span class="card-title">${w.title}</span>
        <span class="card-badge">📱</span>
      </div>`;
    card.addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = w.download;
      a.download = w.title + '.jpg';
      document.body.appendChild(a); a.click(); a.remove();
    });
    grid.appendChild(card);
  });
}

function applyFilters() {
  const q = searchInput.value.trim().toLowerCase();
  let list = wallpapers;
  if (q) list = list.filter(w => w.title.toLowerCase().includes(q));
  render(list);
}

searchInput.addEventListener('input', applyFilters);
document.getElementById('year').textContent = new Date().getFullYear();
render(wallpapers);
</script>

</body>
</html>
