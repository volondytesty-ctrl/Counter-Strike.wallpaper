<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBOI.TOP — Обои для телефона</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#66c0f4">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OBOI.TOP">
<style>
  :root { --bg-1:#0a0a0f; --bg-2:#14121f; --bg-3:#1a1a2e; --accent:#66c0f4; --accent-2:#a64bff; --card:#16202d; --card-hover:#1e2f42; --text:#c7d5e0; --text-dim:#8f98a0; --green:#6fbf4a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',Arial,sans-serif; background:linear-gradient(135deg,var(--bg-1),var(--bg-2),var(--bg-3)); background-attachment:fixed; color:var(--text); min-height:100vh; }
  header { position:sticky; top:0; z-index:100; background:rgba(10,10,15,.88); backdrop-filter:blur(14px); border-bottom:1px solid rgba(102,192,244,.15); padding:12px 24px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .banner { height:50px; width:auto; border-radius:8px; display:block; transition:transform .3s; }
  .banner:hover { transform:scale(1.04); }
  .nav-tabs { display:flex; gap:6px; margin:0 auto; }
  .nav-tab { padding:9px 18px; border-radius:8px; background:transparent; border:1px solid transparent; color:var(--text-dim); font-size:14px; font-weight:600; cursor:pointer; text-decoration:none; transition:.25s; }
  .nav-tab:hover { color:var(--text); background:rgba(102,192,244,.08); }
  .nav-tab.active { color:#fff; background:linear-gradient(90deg,rgba(102,192,244,.25),rgba(166,75,255,.25)); border-color:rgba(102,192,244,.4); }
  
  .auth-area { display:flex; gap:10px; align-items:center; }
  .user-email { font-size:13px; color:var(--accent); font-weight:600; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .auth-btn { padding:8px 16px; border-radius:6px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); border:none; color:#fff; font-size:13px; font-weight:700; cursor:pointer; transition:.25s; white-space:nowrap; }
  .auth-btn:hover { filter:brightness(1.15); transform:translateY(-2px); }
  .auth-btn.logout { background:transparent; border:1px solid rgba(255,100,100,.5); color:#ff6b6b; }
  .auth-btn.logout:hover { background:rgba(255,100,100,.1); }

  .search-box { flex:1; max-width:320px; position:relative; min-width:180px; }
  .search-box input { width:100%; padding:10px 16px 10px 40px; border-radius:24px; border:1px solid rgba(102,192,244,.25); background:rgba(22,32,45,.9); color:var(--text); font-size:14px; outline:none; }
  .search-box input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(102,192,244,.18); }
  .search-box::before { content:'🔍'; position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:.7; font-size:13px; }
  
  .container { max-width:1400px; margin:0 auto; padding:30px 24px 60px; }
  .page-title { text-align:center; padding:20px 0 10px; }
  .page-title h1 { font-size:clamp(26px,4vw,42px); font-weight:900; margin-bottom:10px; background:linear-gradient(90deg,#fff,var(--accent),var(--accent-2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .page-title p { color:var(--text-dim); font-size:15px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; margin-top:24px; }
  .card { background:var(--card); border-radius:12px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,.5); transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,background .35s; cursor:pointer; display:flex; flex-direction:column; animation:fadeUp .5s ease both; position:relative; }
  .card:hover { transform:translateY(-8px) scale(1.02); box-shadow:0 16px 40px rgba(102,192,244,.25),0 0 0 1px rgba(102,192,244,.4); background:var(--card-hover); }
  @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
  .thumb { position:relative; width:100%; aspect-ratio:9/16; overflow:hidden; background:#0d131c; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .6s cubic-bezier(.2,.8,.2,1),filter .35s; }
  .card:hover .thumb img { transform:scale(1.08); filter:brightness(.75); }
  
  .like-btn { position:absolute; top:10px; right:10px; width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,.5); backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,.2); color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.25s; z-index:10; }
  .like-btn:hover { background:rgba(255,255,255,.2); transform:scale(1.1); }
  .like-btn.liked { color:#ff4d6d; border-color:#ff4d6d; }
  .like-btn.liked::before { content:'❤️'; }
  .like-btn:not(.liked)::before { content:'🤍'; }

  .overlay { position:absolute; inset:0; background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.85)); opacity:0; transition:opacity .35s; display:flex; align-items:flex-end; padding:14px; }
  .card:hover .overlay { opacity:1; }
  .card-info { padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card-title { font-size:14px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  .card-badge { font-size:10px; color:var(--accent); background:rgba(102,192,244,.12); padding:3px 8px; border-radius:4px; font-weight:600; }
  .download-btn { display:inline-flex; align-items:center; gap:8px; background:linear-gradient(90deg,#4c9c3c,var(--green)); color:#fff; border:none; padding:10px 16px; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer; text-decoration:none; transition:.25s; box-shadow:0 4px 12px rgba(0,0,0,.4); white-space:nowrap; }
  .download-btn:hover { filter:brightness(1.15); transform:translateY(-2px); box-shadow:0 8px 20px rgba(111,191,74,.5); }
  .overlay .download-btn { width:100%; justify-content:center; }
  .empty { text-align:center; padding:80px 20px; color:var(--text-dim); font-size:18px; display:none; }
  .empty.show { display:block; }
  footer { text-align:center; padding:30px 20px; color:var(--text-dim); font-size:13px; border-top:1px solid rgba(102,192,244,.1); }
  footer b { color:var(--accent); }

  .modal-header { display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-bottom:1px solid rgba(102,192,244,.15); }
  .modal-title { font-size:18px; font-weight:700; color:#fff; }
  .modal-close { background:transparent; border:none; color:var(--text-dim); font-size:26px; cursor:pointer; width:36px; height:36px; border-radius:50%; transition:.25s; display:flex; align-items:center; justify-content:center; }
  .modal-close:hover { color:#fff; background:rgba(255,255,255,.1); }
  .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); backdrop-filter:blur(6px); z-index:1000; align-items:center; justify-content:center; padding:20px; }
  .modal-bg.show { display:flex; }
  .modal-box { background:var(--card); border-radius:16px; max-width:400px; width:100%; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.7); display:flex; flex-direction:column; animation:modalUp .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes modalUp { from{opacity:0;transform:translateY(30px) scale(.95)} to{opacity:1;transform:translateY(0) scale(1)} }
  .modal-body { padding:24px; }
  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }
  .form-group input { width:100%; padding:12px 16px; border-radius:8px; border:1px solid rgba(102,192,244,.3); background:rgba(0,0,0,.2); color:var(--text); font-size:14px; outline:none; transition:.25s; }
  .form-group input:focus { border-color:var(--accent); background:rgba(0,0,0,.4); }
  .auth-submit { width:100%; padding:14px; border-radius:8px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#fff; border:none; font-size:15px; font-weight:700; cursor:pointer; transition:.25s; margin-top:10px; }
  .auth-submit:hover { filter:brightness(1.15); transform:translateY(-2px); }
  .auth-toggle { text-align:center; margin-top:16px; font-size:13px; color:var(--text-dim); }
  .auth-toggle span { color:var(--accent); cursor:pointer; font-weight:600; }
  .auth-error { color:#ff6b6b; font-size:13px; margin-top:10px; text-align:center; min-height:18px; }
  .google-btn { width:100%; padding:12px; border-radius:8px; background:#fff; color:#333; border:none; font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; margin-top:10px; transition:.25s; }
  .google-btn:hover { background:#eee; }
  .auth-divider { text-align:center; margin:16px 0; color:var(--text-dim); font-size:12px; position:relative; }
  .auth-divider::before, .auth-divider::after { content:''; position:absolute; top:50%; width:40%; height:1px; background:rgba(255,255,255,.1); }
  .auth-divider::before { left:0; } .auth-divider::after { right:0; }

  /* Кубик */
  .dice-container { display: flex; justify-content: center; align-items: center; width: 100%; height: 300px; background: #0d131c; }
  .dice-video { width: 150px; height: 150px; object-fit: contain; }

  @media (max-width:640px) {
    header { padding:10px 14px; gap:10px; }
    .banner { height:38px; }
    .nav-tabs { order:3; width:100%; justify-content:center; flex-wrap:wrap; }
    .search-box { order:4; max-width:100%; flex-basis:100%; }
    .auth-area { margin-left:auto; }
    .grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
    .container { padding:16px 14px 40px; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html"><img src="banner.png" alt="Ash" class="banner"></a>
  <nav class="nav-tabs">
    <a href="index.html" class="nav-tab">📖 История</a>
    <a href="computer.html" class="nav-tab">💻 Компьютер</a>
    <a href="phone.html" class="nav-tab active">📱 Телефон</a>
    <a href="tablet.html" class="nav-tab">📟 Планшет</a>
  </nav>
  
  <div class="auth-area" id="authArea">
    <button class="auth-btn" id="loginBtn">Войти</button>
  </div>

  <div class="search-box"><input type="text" id="search" placeholder="Поиск обоев..." autocomplete="off"></div>
</header>

<main class="container">
  <div class="page-title">
    <h1>📱 Обои для телефона</h1>
    <p>52 вертикальных обоины для смартфона. Скачивание в один клик.</p>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">😔 Ничего не найдено</div>
</main>

<footer>© <span id="year"></span> OBOI.TOP — Created by <b>Ash</b> & DeepSeek</footer>

<!-- Кнопка Рандом -->
<button class="random-btn" id="randomBtn" style="position:fixed; bottom:24px; right:24px; width:60px; height:60px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent-2)); border:none; color:#fff; font-size:28px; cursor:pointer; box-shadow:0 8px 24px rgba(102,192,244,.4); z-index:500; display:flex; align-items:center; justify-content:center;" title="Случайная обоина">🎲</button>

<!-- Модалка рандома -->
<div class="modal-bg" id="randomModal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">🎲 Случайная обоина</span>
      <button class="modal-close" id="modalClose">✖</button>
    </div>
    <div class="modal-image" id="modalImageWrap">
      <div class="dice-container" id="diceAnim" style="display:none;">
        <video id="diceVideo" class="dice-video" src="dice.mp4" muted playsinline></video>
      </div>
      <img id="modalImg" src="" alt="" style="display:none; width:100%; height:auto; max-height:70vh; object-fit:contain;">
    </div>
    <div class="modal-footer" style="padding:16px 22px; display:flex; gap:10px; justify-content:center; border-top:1px solid rgba(102,192,244,.15);">
      <a class="modal-btn download" id="modalDownload" href="#" download style="background:linear-gradient(90deg,#4c9c3c,var(--green)); color:#fff; padding:12px 24px; border-radius:8px; font-weight:700; text-decoration:none;">⬇️ Скачать</a>
      <button class="modal-btn again" id="modalAgain" style="background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#fff; padding:12px 24px; border-radius:8px; font-weight:700; border:none; cursor:pointer;">🎲 Ещё раз</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="authModal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="authTitle">Вход</span>
      <button class="modal-close" id="authClose">✖</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="authEmail" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="authPassword" placeholder="Минимум 6 символов">
      </div>
      <button class="auth-submit" id="authSubmit">Войти</button>
      <div class="auth-divider">или</div>
      <button class="google-btn" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Войти через Google
      </button>
      <div class="auth-toggle" id="authToggle">
        Нет аккаунта? <span>Зарегистрироваться</span>
      </div>
      <div class="auth-error" id="authError"></div>
    </div>
  </div>
</div>

<script type="module" src="auth.js"></script>

<script type="module">
const PHONE_COUNT = 85;
const wallpapers = [];
for (let i = 1; i <= PHONE_COUNT; i++) {
  const fileName = "1 (" + i + ").jpg";
  wallpapers.push({
    id: "Телефон_" + i,
    title: "Обои " + i,
    img: "wallpaper/" + encodeURIComponent("Телефон") + "/" + encodeURIComponent(fileName),
    download: "wallpaper/" + encodeURIComponent("Телефон") + "/" + encodeURIComponent(fileName)
  });
}

let currentUser = null;
let userLikes = {};

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const searchInput = document.getElementById('search');

function createCard(w) {
  const isLiked = userLikes[w.id] === true;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="thumb">
      <img src="${w.img}" alt="${w.title}" loading="lazy">
      ${currentUser ? `<button class="like-btn ${isLiked ? 'liked' : ''}" data-id="${w.id}" onclick="event.stopPropagation(); toggleLike('${w.id}')"></button>` : ''}
      <div class="overlay"><a class="download-btn" href="${w.download}" download onclick="event.stopPropagation()">⬇️ Скачать</a></div>
    </div>
    <div class="card-info"><span class="card-title">${w.title}</span><span class="card-badge">📱</span></div>`;
  card.addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = w.download; a.download = w.title + '.jpg';
    document.body.appendChild(a); a.click(); a.remove();
  });
  return card;
}

function render(list) {
  grid.innerHTML = '';
  if (!list.length) { empty.classList.add('show'); return; }
  empty.classList.remove('show');
  list.forEach(w => grid.appendChild(createCard(w)));
}

function applyFilters() {
  const q = searchInput.value.trim().toLowerCase();
  let list = wallpapers;
  if (q) list = list.filter(w => w.title.toLowerCase().includes(q));
  render(list);
}

searchInput.addEventListener('input', applyFilters);
document.getElementById('year').textContent = new Date().getFullYear();
render(wallpapers);

// --- АВТОРИЗАЦИЯ ---
const authModal = document.getElementById('authModal');
const authTitle = document.getElementById('authTitle');
const authEmail = document.getElementById('authEmail');
const authPassword = document.getElementById('authPassword');
const authSubmit = document.getElementById('authSubmit');
const authToggle = document.getElementById('authToggle');
const authError = document.getElementById('authError');
const googleBtn = document.getElementById('googleBtn');
const loginBtn = document.getElementById('loginBtn');
const authArea = document.getElementById('authArea');
let isRegisterMode = false;

document.getElementById('authClose').onclick = () => authModal.classList.remove('show');
authModal.onclick = (e) => { if (e.target === authModal) authModal.classList.remove('show'); };
loginBtn.onclick = () => { authModal.classList.add('show'); isRegisterMode = false; updateAuthUI(); };
authToggle.onclick = () => { isRegisterMode = !isRegisterMode; updateAuthUI(); };

function updateAuthUI() {
  authTitle.textContent = isRegisterMode ? 'Регистрация' : 'Вход';
  authSubmit.textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
  authToggle.innerHTML = isRegisterMode ? 'Уже есть аккаунт? <span>Войти</span>' : 'Нет аккаунта? <span>Зарегистрироваться</span>';
  authError.textContent = '';
}

function initAuth() {
  if (!window.checkAuth) { setTimeout(initAuth, 100); return; }
  window.checkAuth(async (user) => {
    currentUser = user;
    if (user) {
      userLikes = await window.getUserLikes(user.uid) || {};
      authArea.innerHTML = `<span class="user-email">${user.email}</span><button class="auth-btn logout" id="logoutBtn">Выйти</button>`;
      document.getElementById('logoutBtn').onclick = () => window.logoutUser();
    } else {
      userLikes = {};
      authArea.innerHTML = `<button class="auth-btn" id="loginBtn">Войти</button>`;
      document.getElementById('loginBtn').onclick = () => authModal.classList.add('show');
    }
    applyFilters();
  });

  authSubmit.onclick = async () => {
    const email = authEmail.value.trim(); const pass = authPassword.value;
    if (!email || !pass) { authError.textContent = 'Заполните все поля'; return; }
    authError.textContent = 'Загрузка...';
    try {
      if (isRegisterMode) await window.registerUser(email, pass); else await window.loginUser(email, pass);
      authModal.classList.remove('show');
    } catch (e) { authError.textContent = 'Ошибка: ' + e.message; }
  };
  googleBtn.onclick = async () => { try { await window.loginGoogle(); authModal.classList.remove('show'); } catch (e) { authError.textContent = 'Ошибка Google: ' + e.message; } };
}
initAuth();

// --- РАНДОМ С ВИДЕО ---
function showRandom() {
  if (!wallpapers.length) return;
  const item = wallpapers[Math.floor(Math.random() * wallpapers.length)];

  const modalImg = document.getElementById('modalImg');
  const diceAnim = document.getElementById('diceAnim');
  const diceVideo = document.getElementById('diceVideo');
  const modalFooter = document.querySelector('#randomModal .modal-footer');
  const modalTitle = document.querySelector('#randomModal .modal-title');

  modalImg.style.display = 'none';
  modalFooter.style.visibility = 'hidden';
  modalTitle.textContent = '🎲 Бросаем кубик...';
  diceAnim.style.display = 'flex';
  
  diceVideo.currentTime = 0;
  diceVideo.play();

  const fallbackTimer = setTimeout(showImage, 1200); 
  function showImage() {
    clearTimeout(fallbackTimer);
    diceAnim.style.display = 'none';
    diceVideo.pause(); 
    modalImg.src = item.img;
    modalImg.style.display = 'block';
    document.getElementById('modalDownload').href = item.download;
    modalFooter.style.visibility = 'visible';
    modalTitle.textContent = '🎲 Случайная обоина';
  }
  diceVideo.onended = showImage;
}

const randomModal = document.getElementById('randomModal');
document.getElementById('randomBtn').onclick = () => { randomModal.classList.add('show'); showRandom(); };
document.getElementById('modalClose').onclick = () => randomModal.classList.remove('show');
document.getElementById('modalAgain').onclick = showRandom;
randomModal.onclick = (e) => { if (e.target === randomModal) randomModal.classList.remove('show'); };

window.toggleLike = async (id) => {
  if (!currentUser) { alert('Войдите, чтобы лайкать обои!'); return; }
  const newState = !userLikes[id];
  userLikes[id] = newState;
  await window.saveLike(currentUser.uid, id, newState);
  const btn = document.querySelector(`.like-btn[data-id="${id}"]`);
  if (btn) btn.classList.toggle('liked', newState);
};
</script>

</body>
</html>
